appId: com.vigilantengine.desktop
productName: Vigilant Engine
electronVersion: 44.7.0
asar: true
npmRebuild: false
compression: normal
directories:
  output: ../release
files:
  - main.cjs
  - policy.cjs
  - backend.cjs
  - client/**
  - package.json
  - "!**/node_modules/**"
win:
  target:
    - target: portable
      arch: [x64]
    - target: zip
      arch: [x64]
  executableName: VigilantEngine
  signAndEditExecutable: false
  artifactName: VigilantEngine-${version}-Windows-x64.${ext}
portable:
  requestExecutionLevel: user
