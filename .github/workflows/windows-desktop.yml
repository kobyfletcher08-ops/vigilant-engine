name: Windows desktop executable
on:
  push:
    branches: [windows-desktop-rebuild]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 30
    env:
      NODE_OPTIONS: --max-old-space-size=4096
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Run regression tests
        run: pnpm test
      - name: Type-check
        run: pnpm exec tsc --noEmit
      - name: Build frontend and local backend
        run: pnpm desktop:build
      - name: Verify all local API routes
        run: pnpm desktop:smoke
      - name: Install Electron runtime
        run: node node_modules/electron/install.js
      - name: Verify the Windows window loads the app
        run: pnpm exec electron desktop-package --smoke-desktop
      - name: Package Windows portable EXE and ZIP
        run: pnpm exec electron-builder --projectDir desktop-package --config ../electron-builder.yml --win portable zip --x64
      - name: Upload Windows downloads
        uses: actions/upload-artifact@v4
        with:
          name: VigilantEngine-Windows-x64
          if-no-files-found: error
          retention-days: 30
          path: |
            release/*.exe
            release/*.zip
